<form method="get" class="row g-2 align-items-end mb-4">
  <div class="col-sm-6">
    <label for="search_title" class="form-label small mb-1">Search by title</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input
        type="search"
        id="search_title"
        name="search_title"
        class="form-control"
        placeholder="e.g. food bank"
        value="{{ search_title }}"
      />
    </div>
  </div>
  <div class="col-sm-4">
    <label for="date" class="form-label small mb-1">On date</label>
    <input
      type="date"
      id="date"
      name="date"
      class="form-control"
      value="{{ date }}"
    />
  </div>
  <div class="col-sm-2 d-grid">
    <button type="submit" class="btn btn-primary">Filter</button>
  </div>
</form>
