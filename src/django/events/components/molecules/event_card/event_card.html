<div class="col">
  <div class="card h-100 shadow-sm">
    {% if event.image %}
      <img
        src="{{ event.image.url }}"
        class="card-img-top"
        alt="{{ event.title }}"
        style="height: 160px; object-fit: cover;"
      />
    {% else %}
      <div
        class="card-img-top bg-secondary-subtle d-flex align-items-center justify-content-center text-secondary"
        style="height: 160px;"
      >
        <i class="bi bi-image fs-2"></i>
      </div>
    {% endif %}
    <div class="card-body d-flex flex-column">
      <h2 class="card-title h6">{{ event.title }}</h2>
      <p class="card-text small text-secondary mb-2">
        <i class="bi bi-calendar3"></i> {{ event.date }}
        {% if event.time %}, {{ event.time }}{% endif %}
        · <i class="bi bi-geo-alt"></i> {{ event.location }}
      </p>
      <a
        href="{% url 'event_detail' event.pk %}"
        class="btn btn-sm btn-outline-primary mt-auto align-self-start"
      >View</a>
    </div>
  </div>
</div>
