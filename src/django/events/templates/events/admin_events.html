{% component "base" title="Admin dashboard" %}
  {% fill "content" %}
    <h1 class="h4 mb-1">
      All events
      <span class="badge text-bg-danger align-middle">ADMIN</span>
    </h1>
    <p class="text-secondary small">Edit or delete any event.</p>

    <form method="get" class="mb-3" style="max-width: 320px;">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input
          type="search"
          name="search_title"
          class="form-control"
          placeholder="Search any event…"
          value="{{ search_title }}"
        />
        <button type="submit" class="btn btn-outline-secondary">Search</button>
      </div>
    </form>

    {% if events %}
      {% component "event_table" events=events show_owner=True / %}
    {% else %}
      <p class="text-secondary text-center py-4">No events found.</p>
    {% endif %}
  {% endfill %}
{% endcomponent %}
