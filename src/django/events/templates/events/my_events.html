{% component "base" title="My events" %}
  {% fill "content" %}
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">My events</h1>
      <a href="{% url 'event_create' %}" class="btn btn-success btn-sm">
        <i class="bi bi-plus-lg"></i> New
      </a>
    </div>

    {% if events %}
      {% component "event_table" events=events / %}
    {% else %}
      <p class="text-secondary text-center py-4">
        You haven't posted any events yet.
        <a href="{% url 'event_create' %}">Create one.</a>
      </p>
    {% endif %}
  {% endfill %}
{% endcomponent %}
