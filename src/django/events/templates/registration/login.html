{% component "base" title="Log in" %}
  {% fill "content" %}
    {% component "centered_card" max_width="380px" %}
      {% fill "content" %}
        <h1 class="card-title h4 mb-3">Log in</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% component "form_fields" form=form / %}
          <input type="hidden" name="next" value="{{ next }}" />
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="text-center small text-secondary mt-3 mb-0">
          No account? <a href="{% url 'signup' %}">Sign up</a>
        </p>
      {% endfill %}
    {% endcomponent %}
  {% endfill %}
{% endcomponent %}
