{% component "base" title="Logged out" %}

      <i class="bi bi-check-circle text-success" style="font-size: 2.5rem;"></i>
      <h1 class="h4 mt-2">You've been logged out</h1>
      <p class="text-secondary">Thanks for visiting CannyByte. See you next time!</p>
      <a href="{% url 'login' %}" class="btn btn-primary me-2">Log back in</a>
      <a href="{% url 'home' %}" class="btn btn-outline-secondary">Home</a>
    </div>
  {% endfill %}
{% endcomponent %}
